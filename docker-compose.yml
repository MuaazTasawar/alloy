version: "3.9"

services:
  postgres:
    image: ankane/pgvector:latest
    container_name: alloy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - alloy_pg_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: alloy-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rag-service:
    build:
      context: ./rag-service
    container_name: alloy-rag-service
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${RAG_SERVICE_PORT}:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 15s
      timeout: 10s
      retries: 5
      # Base model weights load into memory on first request-triggered call;
      # give it room before the orchestrator starts flagging it unhealthy.
      start_period: 60s

  finetune-service:
    build:
      context: ./finetune-service
    container_name: alloy-finetune-service
    restart: unless-stopped
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "${FINETUNE_SERVICE_PORT}:8002"
    volumes:
      - alloy_adapters:/app/adapters
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  judge-service:
    build:
      context: ./judge-service
    container_name: alloy-judge-service
    restart: unless-stopped
    env_file: .env
    ports:
      - "${JUDGE_SERVICE_PORT}:8003"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 15s
      timeout: 10s
      retries: 5

  gateway:
    build:
      context: ./gateway
    container_name: alloy-gateway
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      rag-service:
        condition: service_healthy
      finetune-service:
        condition: service_healthy
      judge-service:
        condition: service_healthy
    ports:
      - "${GATEWAY_PORT}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  dashboard:
    build:
      context: ./dashboard
    container_name: alloy-dashboard
    restart: unless-stopped
    env_file: .env
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "${DASHBOARD_PORT}:3000"

volumes:
  alloy_pg_data:
  alloy_adapters: